<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>Ride Pool</title>
<link rel="stylesheet" href="/css/style.css"/>
<style>
#map { height: 60vh; }
#ridesList div { padding:6px; border-bottom:1px solid #ccc; }
</style>
</head>
<body>
<h2>Ride Pool</h2>
<div style="display:flex; gap:20px;">
  <div style="flex:1;">
    <div id="map"></div>
  </div>
  <div style="width:350px;">
    <h3>Create a Ride</h3>
    <form id="createRide">
      <input id="driverId" placeholder="Driver ID" required><br>
      <input id="from" placeholder="From lat,lng" required><br>
      <input id="to" placeholder="To lat,lng" required><br>
      <input id="seats" type="number" min="1" max="8" value="2"><br>
      <button>Create</button>
    </form>
    <hr>
    <h3>Nearby Rides</h3>
    <button id="searchNearby">Search</button>
    <div id="ridesList"></div>
  </div>
</div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="/js/ridepool.js"></script>
</body>
</html>
